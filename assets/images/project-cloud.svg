<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0717"/>
      <stop offset="100%" stop-color="#190e2e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg3)"/>
  
  <g transform="translate(60, 50)">
    <!-- Main Cloud Node -->
    <rect x="180" y="20" width="120" height="80" rx="14" fill="#22113d" stroke="#8750f7" stroke-width="2"/>
    <text x="240" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c4b5fd" font-weight="bold" text-anchor="middle">Vue.js Frontend</text>
    <text x="240" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Port 8080 : SPA</text>

    <!-- Connector lines -->
    <path d="M 240 100 L 240 140" stroke="#8750f7" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 240 140 L 120 170" stroke="#8750f7" stroke-width="2"/>
    <path d="M 240 140 L 360 170" stroke="#8750f7" stroke-width="2"/>

    <!-- Java Backend Node -->
    <rect x="60" y="170" width="120" height="80" rx="14" fill="#190d2e" stroke="#3b1f69" stroke-width="2"/>
    <text x="120" y="205" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Java Backend</text>
    <text x="120" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">RESTful Microservices</text>

    <!-- Docker Node -->
    <rect x="300" y="170" width="120" height="80" rx="14" fill="#190d2e" stroke="#3b1f69" stroke-width="2"/>
    <text x="360" y="205" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Docker Cluster</text>
    <text x="360" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Containerized Pods</text>

    <!-- Badge icon center -->
    <circle cx="240" cy="140" r="14" fill="#8750f7"/>
    <text x="240" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">☁</text>
  </g>
</svg>
