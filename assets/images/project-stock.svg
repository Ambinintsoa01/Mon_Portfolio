<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8750f7"/>
      <stop offset="100%" stop-color="#2a1454"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="380" fill="url(#bg1)"/>
  <circle cx="500" cy="80" r="120" fill="#8750f7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="80" cy="300" r="90" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Dashboard Mockup Window -->
  <g transform="translate(45, 45)">
    <rect width="510" height="290" rx="14" fill="#130b20" stroke="#372061" stroke-width="1.5"/>
    <!-- Top bar -->
    <rect width="510" height="36" rx="14" fill="#1c1030"/>
    <rect y="26" width="510" height="10" fill="#1c1030"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="48" cy="18" r="4.5" fill="#10b981"/>
    <rect x="180" y="11" width="150" height="14" rx="7" fill="#2a1745"/>
    <text x="255" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9f7aea" text-anchor="middle" font-weight="600">Stock &amp; Sales Management</text>

    <!-- Sidebar -->
    <rect x="0" y="36" width="90" height="254" fill="#11091d"/>
    <rect x="14" y="55" width="62" height="10" rx="5" fill="#8750f7" opacity="0.8"/>
    <rect x="14" y="75" width="50" height="7" rx="3.5" fill="#362254"/>
    <rect x="14" y="93" width="55" height="7" rx="3.5" fill="#362254"/>
    <rect x="14" y="111" width="48" height="7" rx="3.5" fill="#362254"/>
    <rect x="14" y="129" width="52" height="7" rx="3.5" fill="#362254"/>

    <!-- Main Content -->
    <!-- Stat card 1 -->
    <rect x="105" y="52" width="120" height="52" rx="8" fill="#1a0f2c" stroke="#2c1a45"/>
    <rect x="117" y="63" width="45" height="7" rx="3" fill="#8750f7"/>
    <text x="117" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">+1,420</text>
    <text x="175" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#10b981">▲ 14.8%</text>

    <!-- Stat card 2 -->
    <rect x="235" y="52" width="120" height="52" rx="8" fill="#1a0f2c" stroke="#2c1a45"/>
    <rect x="247" y="63" width="50" height="7" rx="3" fill="#6366f1"/>
    <text x="247" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">Ar 48.5M</text>
    <text x="312" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#10b981">▲ 22.3%</text>

    <!-- Stat card 3 -->
    <rect x="365" y="52" width="130" height="52" rx="8" fill="#1a0f2c" stroke="#2c1a45"/>
    <rect x="377" y="63" width="40" height="7" rx="3" fill="#ec4899"/>
    <text x="377" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">98.4%</text>
    <text x="430" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#9f7aea">Stock OK</text>

    <!-- Chart Area -->
    <rect x="105" y="114" width="250" height="155" rx="10" fill="#1a0f2c" stroke="#2c1a45"/>
    <text x="120" y="133" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Flux d'achats &amp; Ventes</text>
    <path d="M 120 230 Q 160 210, 200 170 T 260 180 T 310 140 T 340 150" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120 230 Q 160 210, 200 170 T 260 180 T 310 140 T 340 150 L 340 245 L 120 245 Z" fill="url(#pGrad)" opacity="0.3"/>

    <!-- Right list -->
    <rect x="365" y="114" width="130" height="155" rx="10" fill="#1a0f2c" stroke="#2c1a45"/>
    <text x="377" y="133" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1" font-weight="bold">Transactions</text>
    <rect x="377" y="145" width="106" height="22" rx="5" fill="#25143d"/>
    <rect x="377" y="174" width="106" height="22" rx="5" fill="#25143d"/>
    <rect x="377" y="203" width="106" height="22" rx="5" fill="#25143d"/>
    <rect x="377" y="232" width="106" height="22" rx="5" fill="#25143d"/>
  </g>
</svg>
