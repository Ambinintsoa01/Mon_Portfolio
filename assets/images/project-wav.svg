    <g transform="translate(30, 130)">
      <rect width="440" height="110" rx="8" fill="#140a24" stroke="#2e174e"/>
      <!-- Wave bars -->
      <path d="M 10 55 Q 30 10, 50 55 T 90 55 T 130 55 T 170 55 T 210 55 T 250 55 T 290 55 T 330 55 T 370 55 T 410 55 T 430 55" fill="none" stroke="#4c268a" stroke-width="2"/>
      <path d="M 10 55 Q 25 15, 40 55 Q 60 95, 80 55 Q 100 20, 120 55 Q 145 90, 170 55 Q 195 5, 220 55 Q 245 100, 270 55 Q 295 15, 320 55 Q 350 85, 380 55 Q 405 25, 430 55" fill="none" stroke="#a855f7" stroke-width="2.5"/>
      <text x="220" y="100" font-family="Consolas, monospace" font-size="10" fill="#9ca3af" text-anchor="middle">PCM Bitstream &amp; Frequency Domain Processing</text>
    </g>

    <text x="25" y="270" font-family="Consolas, monospace" font-size="11" fill="#67e8f9">✓ Synthesis &amp; Low-level Audio Processing Complete [Status: OK]</text>
