<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0717"/>
      <stop offset="100%" stop-color="#1c0f33"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg4)"/>
  
  <g transform="translate(50, 40)">
    <!-- Terminal window -->
    <rect width="500" height="290" rx="14" fill="#0d0617" stroke="#8750f7" stroke-width="1.5"/>
    <rect width="500" height="32" rx="14" fill="#1b0e30"/>
    <rect y="24" width="500" height="8" fill="#1b0e30"/>
    <circle cx="18" cy="16" r="4.5" fill="#ef4444"/>
    <circle cx="32" cy="16" r="4.5" fill="#f59e0b"/>
    <circle cx="46" cy="16" r="4.5" fill="#10b981"/>
    <text x="250" y="20" font-family="Consolas, monospace" font-size="10" fill="#a78bfa" text-anchor="middle">python3 wav_analyzer.py --binary-inspect</text>

    <!-- Terminal binary stream -->
    <text x="25" y="65" font-family="Consolas, monospace" font-size="11" fill="#8750f7">&gt; RIFF Header [52 49 46 46] : Valid WAV File</text>
    <text x="25" y="85" font-family="Consolas, monospace" font-size="11" fill="#c4b5fd">&gt; Channels: 2 (Stereo) | SampleRate: 44100 Hz | Bits: 16-bit PCM</text>
    <text x="25" y="105" font-family="Consolas, monospace" font-size="11" fill="#10b981">&gt; ByteRate: 176400 bytes/sec | Subchunk2Size: 35,280,000 bytes</text>

