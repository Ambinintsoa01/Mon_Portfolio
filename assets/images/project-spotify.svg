<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#180e2a"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8750f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg7)"/>
  <circle cx="480" cy="90" r="130" fill="#10b981" opacity="0.08" filter="blur(40px)"/>
  <circle cx="120" cy="280" r="120" fill="#8750f7" opacity="0.1" filter="blur(40px)"/>
  
  <g transform="translate(60, 45)">
    <!-- Music Player Frame -->
    <rect width="480" height="280" rx="16" fill="#12091f" stroke="#8750f7" stroke-width="1.5"/>
    
    <!-- Player Top -->
    <rect x="25" y="25" width="85" height="85" rx="12" fill="#24143d" stroke="#3d1f69"/>
    <circle cx="67" cy="67" r="24" fill="#8750f7"/>
    <polygon points="63,57 76,67 63,77" fill="#ffffff"/>
    
    <text x="130" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">MP3 Audio Streamer &amp; Loader</text>
    <text x="130" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a78bfa">Java Backend Server • JavaScript Web Client</text>
    <rect x="130" y="85" width="75" height="20" rx="10" fill="#10b981" opacity="0.2"/>
    <text x="167" y="99" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981" font-weight="bold" text-anchor="middle">STREAMING ON</text>
    
    <!-- Playback bar -->
    <rect x="25" y="130" width="430" height="6" rx="3" fill="#261440"/>
    <rect x="25" y="130" width="260" height="6" rx="3" fill="url(#streamGrad)"/>
    <circle cx="285" cy="133" r="6" fill="#ffffff"/>
    
    <text x="25" y="152" font-family="Consolas, monospace" font-size="9" fill="#9ca3af">02:45</text>
    <text x="430" y="152" font-family="Consolas, monospace" font-size="9" fill="#9ca3af">04:12</text>
    
    <!-- Equalizer bars -->
    <g transform="translate(25, 175)">
      <rect x="0" y="0" width="430" height="80" rx="10" fill="#180e29" stroke="#2e174b"/>
      <rect x="25" y="45" width="12" height="25" rx="3" fill="#8750f7"/>
      <rect x="45" y="25" width="12" height="45" rx="3" fill="#a855f7"/>
      <rect x="65" y="15" width="12" height="55" rx="3" fill="#c084fc"/>
      <rect x="85" y="35" width="12" height="35" rx="3" fill="#8750f7"/>
      <rect x="105" y="20" width="12" height="50" rx="3" fill="#10b981"/>
      <rect x="125" y="40" width="12" height="30" rx="3" fill="#34d399"/>
      <rect x="145" y="10" width="12" height="60" rx="3" fill="#8750f7"/>
      <rect x="165" y="30" width="12" height="40" rx="3" fill="#a855f7"/>
      <rect x="185" y="50" width="12" height="20" rx="3" fill="#c084fc"/>

      <text x="225" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Dynamic Audio Pipeline</text>
      <text x="225" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9ca3af">Chunked HTTP audio transfer with zero buffer lag</text>
    </g>
  </g>
</svg>
